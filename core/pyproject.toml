[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bestfiend-core"
version = "0.1.0"
description = "BestFiend core — модульный монолит."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.122.0,<1.0",
    "uvicorn>=0.35.0,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "loguru>=0.7.3,<1.0",
    "httpx>=0.27.0,<1.0",
    "langfuse>=4,<5",
    "uuid6>=2024.7.10",
    "tiktoken>=0.7,<1.0",
    "fastmcp>=3.2.0,<3.3",
    "orjson>=3.10,<4.0",
    "langgraph>=1.0.7",
    "langchain-core>=1.2.7",
    "tzdata>=2024.1",
    "aiogram>=3.30,<4.0",
    "bcrypt>=4.0,<5.0",
    "langchain>=1.3.1",
    "langchain-openai>=1.2.2",
    "langchain-groq>=1.1.2",
    "langchain-ollama>=1.1.0",
    "langchain-openrouter>=0.2.3",
    "boto3>=1.43.18",
    "pgvector>=0.3.6,<1.0",
    "mcp>=1.27,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bestfiend"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
